# Preserve the imported upstream tree byte-for-byte in the history-import PR. Issue #8
# establishes the source-wide downstream formatting baseline after the toolchain is pinned.
exclude: '^(assets/|benchmarks/|freetoken-kernel-cache/|python/|tests/|docs/(cli|install|models|quickstart)\.md$|scripts/(build-release-wheels|publish-wheels)\.sh$|scripts/ci/(manylinux-build\.sh|retag-manylinux\.py)$|\.github/workflows/(nightly-wheels|release)\.yml$|install\.sh$|setup\.py$|vendor/|third_party/|upstream/|build/)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--ignore, vendor, --ignore, third_party, --ignore, upstream]
