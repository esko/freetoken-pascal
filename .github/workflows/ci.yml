name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit ruff pytest pyyaml
      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Validate documentation and manifests
        run: |
          python scripts/validate_docs.py
          python scripts/check_upstream_manifest.py
      - name: Python checks for existing source roots
        shell: bash
        run: |
          set -euo pipefail
          dirs=()
          for dir in src tests scripts; do
            [[ -d "$dir" ]] && dirs+=("$dir")
          done
          if ((${#dirs[@]})); then
            python -m compileall -q "${dirs[@]}"
            ruff check "${dirs[@]}"
            ruff format --check "${dirs[@]}"
          else
            echo "No Python source directories yet."
          fi
      - name: Unit tests when tests exist
        shell: bash
        run: |
          set -euo pipefail
          if find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            pytest -m "not sm61 and not dual_p4 and not large_model and not benchmark"
          else
            echo "No hosted unit tests yet."
          fi
