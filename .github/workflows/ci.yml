name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi \
            jsonschema \
            msgpack \
            pre-commit \
            pydantic \
            pytest \
            pyyaml \
            pyzmq \
            ruff \
            uvicorn
      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Validate documentation and manifests
        run: |
          python scripts/validate_docs.py
          python scripts/check_upstream_manifest.py
      - name: Compile imported source and tests
        run: python -m compileall -q python tests scripts
      - name: Lint downstream repository tooling
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: Run viable CPU-safe upstream tests
        env:
          PYTHONPATH: python
        run: pytest -q tests/project tests/daemon
