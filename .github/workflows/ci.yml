name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository tooling
        run: python -m pip install --require-hashes -r requirements/cpu.lock
      - name: Verify dependency locks are reproducible
        run: |
          scripts/lock_dependencies.sh
          git diff --exit-code -- requirements/cpu.lock requirements/cuda126.lock
      - name: Verify generated fixtures are reproducible
        run: |
          python scripts/generate_test_fixtures.py
          git diff --exit-code -- tests/fixtures/gguf
      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Validate documentation and manifests
        run: |
          python scripts/validate_docs.py
          python scripts/check_upstream_manifest.py
          python scripts/check_toolchain.py
          python scripts/check_lint_baseline.py
          python scripts/validate_evidence.py
      - name: Report deferred hardware gates
        run: echo "::notice title=H2/H3 deferred::Tesla P4 hardware is not installed; only the manual inventory-verified self-hosted workflow may satisfy hardware gates."
      - name: Compile imported source and tests
        run: python -m compileall -q python tests scripts
      - name: Lint H0 router contract
        run: |
          ruff check python/freetoken/moe/router_contract.py tests/moe/test_router_contract.py
          ruff format --check python/freetoken/moe/router_contract.py tests/moe/test_router_contract.py
      - name: Run bounded host-resource lifecycle observation
        env:
          PYTHONPATH: python
        run: timeout 60s python scripts/stress_host_resources.py --seed 18 --iterations 3 --threads 2 --allow-fallback
      - name: Lint downstream repository tooling
        run: |
          ruff check scripts python/freetoken/cache_simulator.py python/freetoken/gguf_validation.py python/freetoken/kernel/pinned.py python/freetoken/moe/cpu_abi.py python/freetoken/moe/ggml_reference.py python/freetoken/moe/q4_k.py python/freetoken/moe/mixed_gemv.py python/freetoken/moe/gguf_cpu.py python/freetoken/moe/gguf_layer.py python/freetoken/moe/gguf_transfer.py python/freetoken/moe/real_artifact_probe.py python/freetoken/moe/real_artifact_benchmark.py python/freetoken/models/qwen4_exp/gguf_attach.py python/freetoken/engine/placement_plan.py python/freetoken/engine/placement_profile.py tests/project tests/engine/test_placement_plan.py tests/engine/test_placement_profile.py tests/models/test_qwen4_exp_gguf_attach.py tests/moe/test_host_banks.py tests/moe/test_cpu_abi.py tests/moe/test_ggml_reference.py tests/moe/test_q4_k_mixed_reference.py tests/moe/test_q4_k.py tests/moe/test_mixed_gemv.py tests/moe/test_q4_k_threaded.py tests/moe/test_q4_k_threaded_mixed.py tests/moe/test_gguf_cpu_bridge.py tests/moe/test_gguf_cpu_layer.py tests/moe/test_gguf_transfer.py tests/project/test_qwen38_real_expert_probe.py
          ruff format --check scripts python/freetoken/cache_simulator.py python/freetoken/gguf_validation.py python/freetoken/kernel/pinned.py python/freetoken/moe/cpu_abi.py python/freetoken/moe/ggml_reference.py python/freetoken/moe/q4_k.py python/freetoken/moe/mixed_gemv.py python/freetoken/moe/gguf_cpu.py python/freetoken/moe/real_artifact_probe.py python/freetoken/moe/real_artifact_benchmark.py python/freetoken/models/qwen4_exp/gguf_attach.py python/freetoken/engine/placement_plan.py python/freetoken/engine/placement_profile.py tests/project tests/engine/test_placement_plan.py tests/engine/test_placement_profile.py tests/models/test_qwen4_exp_gguf_attach.py tests/moe/test_host_banks.py tests/moe/test_cpu_abi.py tests/moe/test_ggml_reference.py tests/moe/test_q4_k_mixed_reference.py tests/moe/test_q4_k.py tests/moe/test_mixed_gemv.py tests/moe/test_q4_k_threaded.py tests/moe/test_q4_k_threaded_mixed.py tests/moe/test_gguf_cpu_bridge.py tests/moe/test_gguf_cpu_layer.py tests/moe/test_gguf_transfer.py tests/project/test_qwen38_real_expert_probe.py
      - name: Lint CPU topology policy
        run: |
          ruff check python/freetoken/moe/cpu_topology.py tests/moe/test_cpu_topology.py
          ruff format --check python/freetoken/moe/cpu_topology.py tests/moe/test_cpu_topology.py
      - name: Run viable CPU-safe upstream tests
        env:
          PYTHONPATH: python
        run: pytest -q tests/project tests/daemon tests/engine/test_placement_plan.py tests/engine/test_placement_profile.py tests/models/test_qwen4_exp_gguf_attach.py tests/models/qwen4_exp/test_gdn_reference_cpu.py tests/moe/test_cpu_abi.py tests/moe/test_ggml_reference.py tests/moe/test_q4_k_mixed_reference.py tests/moe/test_q4_k.py tests/moe/test_mixed_gemv.py tests/moe/test_q4_k_threaded.py tests/moe/test_q4_k_threaded_mixed.py tests/moe/test_gguf_cpu_bridge.py tests/moe/test_gguf_cpu_layer.py tests/moe/test_gguf_transfer.py tests/moe/test_stress_host_resources.py
      - name: Run CPU topology policy tests
        env:
          PYTHONPATH: python
        run: pytest -q tests/moe/test_cpu_topology.py
      - name: Run host-memory swap probe tests
        env:
          PYTHONPATH: python
        run: |
          ruff check python/freetoken/moe/host_memory.py tests/moe/test_host_memory.py
          ruff format --check python/freetoken/moe/host_memory.py tests/moe/test_host_memory.py
          pytest -q tests/moe/test_host_memory.py
      - name: Run NUMA placement policy tests
        env:
          PYTHONPATH: python
        run: |
          ruff check python/freetoken/moe/numa_memory.py tests/moe/test_numa_memory.py
          ruff format --check python/freetoken/moe/numa_memory.py tests/moe/test_numa_memory.py
          pytest -q tests/moe/test_numa_memory.py
      - name: Lint and test CPU affinity policy
        run: |
          ruff check python/freetoken/moe/cpu_affinity.py tests/moe/test_cpu_affinity.py tests/moe/test_cpu_moe_affinity_native.py
          ruff format --check python/freetoken/moe/cpu_affinity.py tests/moe/test_cpu_affinity.py tests/moe/test_cpu_moe_affinity_native.py
          PYTHONPATH=python pytest -q tests/moe/test_cpu_affinity.py tests/moe/test_cpu_moe_affinity_native.py
