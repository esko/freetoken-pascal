name: CUDA 12.6 sm_61

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda126-sm61-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h0-container:
    name: H0 pinned CPU container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned CPU environment
        run: docker build --file containers/cpu.Dockerfile --tag freetoken-pascal:cpu .
      - name: Run hosted checks and record inventory
        run: |
          mkdir -p build/toolchain-cpu
          docker run --rm \
            --volume "${PWD}/build/toolchain-cpu:/workspace/freetoken-pascal/build/toolchain-cpu" \
            freetoken-pascal:cpu \
            bash -lc 'python scripts/validate_docs.py && python scripts/check_upstream_manifest.py && python scripts/check_toolchain.py && python scripts/check_lint_baseline.py && python scripts/validate_evidence.py && python -m compileall -q python tests scripts && ruff check scripts python/freetoken/cache_simulator.py python/freetoken/compatibility.py python/freetoken/gguf_validation.py python/freetoken/moe/cpu_abi.py python/freetoken/moe/ggml_reference.py python/freetoken/moe/q4_k.py python/freetoken/moe/mixed_gemv.py python/freetoken/moe/gguf_cpu.py tests/project tests/moe/test_cpu_abi.py tests/moe/test_ggml_reference.py tests/moe/test_q4_k_mixed_reference.py tests/moe/test_q4_k.py tests/moe/test_mixed_gemv.py tests/moe/test_q4_k_threaded_mixed.py tests/moe/test_gguf_cpu_bridge.py && ruff format --check scripts python/freetoken/cache_simulator.py python/freetoken/compatibility.py python/freetoken/gguf_validation.py python/freetoken/moe/cpu_abi.py python/freetoken/moe/ggml_reference.py python/freetoken/moe/q4_k.py python/freetoken/moe/mixed_gemv.py python/freetoken/moe/gguf_cpu.py tests/project tests/moe/test_cpu_abi.py tests/moe/test_ggml_reference.py tests/moe/test_q4_k_mixed_reference.py tests/moe/test_q4_k.py tests/moe/test_mixed_gemv.py tests/moe/test_q4_k_threaded_mixed.py tests/moe/test_gguf_cpu_bridge.py && PYTHONPATH=python pytest -q tests/project tests/daemon tests/moe/test_cpu_abi.py tests/moe/test_ggml_reference.py tests/moe/test_q4_k_mixed_reference.py tests/moe/test_q4_k.py tests/moe/test_mixed_gemv.py tests/moe/test_q4_k_threaded_mixed.py tests/moe/test_gguf_cpu_bridge.py && python scripts/write_toolchain_inventory.py --output build/toolchain-cpu/inventory.json'
      - name: Upload CPU environment evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpu-toolchain
          path: build/toolchain-cpu/
          if-no-files-found: error
          retention-days: 14

  h1-compile:
    name: H1 compile without GPU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned CUDA 12.6 environment
        run: docker build --file containers/cuda126.Dockerfile --tag freetoken-pascal:cuda126 .
      - name: Compile and inspect sm_61 probe
        run: |
          mkdir -p build/toolchain
          docker run --rm \
            --volume "${PWD}/build/toolchain:/workspace/freetoken-pascal/build/toolchain" \
            freetoken-pascal:cuda126 \
            bash -lc 'python scripts/validate_docs.py && python scripts/check_upstream_manifest.py && python scripts/check_toolchain.py && python scripts/check_lint_baseline.py && python scripts/validate_evidence.py && python -m compileall -q python tests scripts && ruff check scripts python/freetoken/cache_simulator.py python/freetoken/compatibility.py python/freetoken/gguf_validation.py python/freetoken/moe/cpu_abi.py python/freetoken/moe/ggml_reference.py python/freetoken/moe/q4_k.py python/freetoken/moe/mixed_gemv.py python/freetoken/moe/gguf_cpu.py tests/project tests/moe/test_cpu_abi.py tests/moe/test_ggml_reference.py tests/moe/test_q4_k_mixed_reference.py tests/moe/test_q4_k.py tests/moe/test_mixed_gemv.py tests/moe/test_q4_k_threaded_mixed.py tests/moe/test_gguf_cpu_bridge.py && ruff format --check scripts python/freetoken/cache_simulator.py python/freetoken/compatibility.py python/freetoken/gguf_validation.py python/freetoken/moe/cpu_abi.py python/freetoken/moe/ggml_reference.py python/freetoken/moe/q4_k.py python/freetoken/moe/mixed_gemv.py python/freetoken/moe/gguf_cpu.py tests/project tests/moe/test_cpu_abi.py tests/moe/test_ggml_reference.py tests/moe/test_q4_k_mixed_reference.py tests/moe/test_q4_k.py tests/moe/test_mixed_gemv.py tests/moe/test_q4_k_threaded_mixed.py tests/moe/test_gguf_cpu_bridge.py && PYTHONPATH=python pytest -q tests/project tests/daemon tests/moe/test_cpu_abi.py tests/moe/test_ggml_reference.py tests/moe/test_q4_k_mixed_reference.py tests/moe/test_q4_k.py tests/moe/test_mixed_gemv.py tests/moe/test_q4_k_threaded_mixed.py tests/moe/test_gguf_cpu_bridge.py && scripts/ci/verify_cuda126.sh'
      - name: Upload toolchain evidence
        uses: actions/upload-artifact@v4
        with:
          name: cuda126-sm61-toolchain
          path: build/toolchain/
          if-no-files-found: error
          retention-days: 14
