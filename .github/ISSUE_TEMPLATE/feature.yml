name: Feature or backlog item
description: Propose a scoped implementation item
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and hardware level
      description: List blocking issues and H0-H4 validation class
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use checkboxes with observable outcomes
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
